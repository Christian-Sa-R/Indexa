<header class="cabecalho">
  <img src="/assets/logo.png" alt="Logo do site" class="logo" />
  @if (!telaInicial) {
    <div class="link">
      <button>
        <img class="seta" src="assets/arrow-left.png" alt="" />
        <a routerLink="/lista-contatos">Voltar</a>
      </button>
    </div>
  }
  <img [src]="imgLink" alt="Banner do site" class="banner" />
  <h1 [innerHtml]="titulo" class="titulo"></h1>
</header>
